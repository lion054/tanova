# portal.tsokatravel.com — Tsoka Portal (GoTrip Laravel CMS)
# Path:   /var/www/tsoka-portal
# Webroot:/var/www/tsoka-portal/public_html
# PHP-FPM: unix:/var/run/php/php8.4-fpm.sock
#
# ISOLATION: Only touches portal.tsokatravel.com.
# Other sites on this server are untouched.

server {
    listen 80;
    listen [::]:80;
    server_name portal.tsokatravel.com;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name portal.tsokatravel.com;

    root /var/www/tsoka-portal/public_html;
    index index.php;

    ssl_certificate     /etc/letsencrypt/live/portal.tsokatravel.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/portal.tsokatravel.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    access_log /var/log/nginx/portal.tsokatravel.com-access.log combined buffer=32k flush=5s;
    error_log  /var/log/nginx/portal.tsokatravel.com-error.log warn;

    client_max_body_size 100M;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss image/svg+xml;

    # Static assets — long cache
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot|mp4|webp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Deny hidden files and .env
    location ~ /\. { deny all; }
    location ~ /\.env { deny all; }

    # Storage symlink (Laravel public disk)
    location /storage {
        alias /var/www/tsoka-portal/bc-cms/storage/app/public;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Uploads directory
    location /uploads {
        alias /var/www/tsoka-portal/bc-cms/storage/app/public/uploads;
        expires 7d;
    }

    # Block direct access to Laravel internals (vendor/ is outside webroot so not needed here)
    location ~ ^/(bootstrap|config|database|resources|routes|tests)/ {
        deny all;
    }

    # GoTrip routing — all requests go through public_html/index.php
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.4-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_param HTTP_HOST $http_host;
        fastcgi_param HTTPS $https;

        fastcgi_connect_timeout  60s;
        fastcgi_send_timeout    300s;
        fastcgi_read_timeout    300s;
        fastcgi_buffer_size     256k;
        fastcgi_buffers         8 512k;
        fastcgi_busy_buffers_size 512k;
        fastcgi_intercept_errors on;
    }

    location ~ \.blade\.php$ { deny all; }
}
